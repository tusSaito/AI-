<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penguin Dyle — 記録</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc; --surface: #ffffff; --text: #1e293b;
      --muted: #64748b; --accent: #0f3460; --accent-light: #1a5276;
      --border: #e2e8f0;
    }
    body { margin:0; font-family:'Hiragino Sans','Noto Sans JP',sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); }

    .app { display:grid; grid-template-rows:auto 1fr; height:100vh; }
    header { background:var(--accent); color:#fff; padding:0.75rem 1.5rem; display:flex; align-items:center; gap:1rem; }
    header h1 { font-size:1.25rem; margin:0; }
    header .subtitle { font-size:0.8rem; opacity:0.8; }
    nav { margin-left:auto; display:flex; gap:0.75rem; align-items:center; }
    nav a { color:#fff; text-decoration:none; font-size:0.85rem; opacity:0.9; }
    nav a:hover { opacity:1; }
    .btn-icon { background:none; border:none; cursor:pointer; color:var(--muted); padding:0.25rem; }
    .btn { padding:0.4rem 0.8rem; background:var(--accent); color:#fff; border:none; border-radius:0.375rem; cursor:pointer; font-size:0.85rem; }
    .btn:hover { background:var(--accent-light); }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }

    .content { overflow-y:auto; padding:1.5rem; max-width:960px; margin:0 auto; width:100%; }

    /* ── セクション ── */
    section { margin-bottom:2rem; }
    section h2 { font-size:1rem; margin:0 0 1rem; display:flex; align-items:center; gap:0.5rem; }

    /* ── カレンダー ── */
    .calendar-header { display:flex; align-items:center; gap:1rem; margin-bottom:0.75rem; }
    #month-label { font-size:0.95rem; font-weight:600; min-width:120px; text-align:center; }
    #calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .cal-header { text-align:center; font-size:0.7rem; color:var(--muted); padding:0.25rem; }
    .cal-empty { padding:0.5rem; }
    .cal-day { padding:0.4rem; text-align:center; font-size:0.8rem; border-radius:0.25rem; position:relative; background:var(--surface); }
    .cal-day.has-entry { font-weight:600; }
    .cal-dot { display:block; width:6px; height:6px; border-radius:50%; margin:2px auto 0; }

    /* ── グラフ ── */
    .range-bar { display:flex; gap:0.5rem; margin-bottom:1rem; }
    .range-btn { padding:0.25rem 0.75rem; border:1px solid var(--border); background:var(--surface); border-radius:0.25rem; cursor:pointer; font-size:0.8rem; }
    .range-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    #graphs { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:1rem; }
    .mini-chart { background:var(--surface); border:1px solid var(--border); border-radius:0.5rem; padding:0.75rem; }
    .chart-label { font-size:0.8rem; color:var(--muted); margin-bottom:0.5rem; }
    .text-muted { color:var(--muted); font-size:0.85rem; }

    /* ── 一覧 ── */
    .search-bar { margin-bottom:0.75rem; }
    .search-bar input { width:100%; padding:0.4rem 0.75rem; border:1px solid var(--border); border-radius:0.375rem; font-size:0.85rem; }
    #entry-list { display:flex; flex-direction:column; gap:0.25rem; }
    .entry-item { display:flex; gap:0.75rem; align-items:center; padding:0.5rem 0.75rem; background:var(--surface); border:1px solid var(--border); border-radius:0.375rem; cursor:pointer; font-size:0.85rem; }
    .entry-item:hover { background:var(--bg); }
    .entry-date { font-weight:600; color:var(--accent); min-width:90px; }
    .entry-preview { color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* ── データ操作 ── */
    .data-actions { display:flex; gap:0.5rem; flex-wrap:wrap; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Penguin Dyle</h1>
        <span class="subtitle">ペンギン大流の日記</span>
      </div>
      <nav>
        <a href="index.html"><i class="fa-solid fa-comments"></i> 会話</a>
        <a href="diary.html"><i class="fa-solid fa-book"></i> 日記</a>
        <a href="archive.html"><i class="fa-solid fa-chart-line"></i> 記録</a>
        <button class="btn-icon" id="theme-toggle" title="テーマ切替">
          <i class="fa-solid fa-moon" style="color:#fff"></i>
        </button>
      </nav>
    </header>

    <div class="content">
      <!-- カレンダー -->
      <section>
        <h2><i class="fa-solid fa-calendar"></i> カレンダー</h2>
        <div class="calendar-header">
          <button class="btn-icon" id="prev-month"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="month-label"></span>
          <button class="btn-icon" id="next-month"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div id="calendar-grid"></div>
      </section>

      <!-- 感情グラフ -->
      <section>
        <h2><i class="fa-solid fa-chart-area"></i> 感情の推移</h2>
        <div class="range-bar">
          <button class="range-btn" data-range="7">7日</button>
          <button class="range-btn active" data-range="30">1ヶ月</button>
          <button class="range-btn" data-range="all">全期間</button>
        </div>
        <div id="graphs"></div>
      </section>

      <!-- 一覧・検索 -->
      <section>
        <h2><i class="fa-solid fa-list"></i> 日記一覧</h2>
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="キーワードで検索…">
        </div>
        <div id="entry-list"></div>
      </section>

      <!-- データ操作 -->
      <section>
        <h2><i class="fa-solid fa-database"></i> データ管理</h2>
        <div class="data-actions">
          <button class="btn" id="export-btn">
            <i class="fa-solid fa-download"></i> エクスポート
          </button>
          <button class="btn btn-ghost" id="import-btn">
            <i class="fa-solid fa-upload"></i> インポート
          </button>
          <button class="btn btn-ghost" id="clear-btn" style="color:#ef4444;border-color:#ef4444">
            <i class="fa-solid fa-trash"></i> 全データ削除
          </button>
          <input type="file" id="import-file" accept="application/json" hidden>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="js/archive-page.js"></script>
</body>
</html>
