<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penguin Dyle — 記録</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Penguin Dyle</h1>
        <span class="subtitle">ペンギン大流の日記</span>
      </div>
      <nav>
        <a href="index.html"><i class="fa-solid fa-comments"></i> 会話</a>
        <a href="diary.html"><i class="fa-solid fa-book"></i> 日記</a>
        <a href="archive.html" class="active"><i class="fa-solid fa-chart-line"></i> 記録</a>
        <button class="btn-icon" id="theme-toggle" title="テーマ切替">
          <i class="fa-solid fa-moon"></i>
        </button>
      </nav>
    </header>

    <div class="content" style="max-width:960px">
      <section>
        <h2><i class="fa-solid fa-calendar"></i> カレンダー</h2>
        <div class="calendar-header">
          <button class="btn-icon" id="prev-month"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="month-label"></span>
          <button class="btn-icon" id="next-month"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div id="calendar-grid"></div>
      </section>

      <section>
        <h2><i class="fa-solid fa-chart-area"></i> 感情の推移</h2>
        <div class="range-bar">
          <button class="range-btn" data-range="7">7日</button>
          <button class="range-btn active" data-range="30">1ヶ月</button>
          <button class="range-btn" data-range="all">全期間</button>
        </div>
        <div id="graphs"></div>
      </section>

      <section>
        <h2><i class="fa-solid fa-list"></i> 日記一覧</h2>
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="キーワードで検索…">
        </div>
        <div id="entry-list"></div>
      </section>

      <section>
        <h2><i class="fa-solid fa-database"></i> データ管理</h2>
        <div class="data-actions">
          <button class="btn" id="export-btn"><i class="fa-solid fa-download"></i> エクスポート</button>
          <button class="btn btn-ghost" id="import-btn"><i class="fa-solid fa-upload"></i> インポート</button>
          <button class="btn btn-ghost" id="clear-btn" style="color:var(--danger);border-color:var(--danger)">
            <i class="fa-solid fa-trash"></i> 全データ削除
          </button>
          <input type="file" id="import-file" accept="application/json" hidden>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="js/archive-page.js"></script>
</body>
</html>
