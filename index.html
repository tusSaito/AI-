<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penguin Dyle — 会話</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ── 基本 ── */
    :root {
      --bg: #f8fafc; --surface: #ffffff; --text: #1e293b;
      --muted: #64748b; --accent: #0f3460; --accent-light: #1a5276;
      --border: #e2e8f0;
    }
    body { margin:0; font-family:'Hiragino Sans','Noto Sans JP',sans-serif; background:var(--bg); color:var(--text); }
    a { color: var(--accent); }

    /* ── レイアウト ── */
    .app { display:grid; grid-template-rows:auto 1fr; height:100vh; }
    header { background:var(--accent); color:#fff; padding:0.75rem 1.5rem; display:flex; align-items:center; gap:1rem; }
    header h1 { font-size:1.25rem; margin:0; }
    header .subtitle { font-size:0.8rem; opacity:0.8; }
    nav { margin-left:auto; display:flex; gap:0.75rem; align-items:center; }
    nav a { color:#fff; text-decoration:none; font-size:0.85rem; opacity:0.9; }
    nav a:hover { opacity:1; }

    .main { display:grid; grid-template-columns:1fr 280px; overflow:hidden; }
    @media(max-width:768px) { .main { grid-template-columns:1fr; } .sidebar { display:none; } }

    /* ── チャットエリア ── */
    .chat-col { display:flex; flex-direction:column; overflow:hidden; }
    #chat-area { flex:1; overflow-y:auto; padding:1rem 1.5rem; display:flex; flex-direction:column; gap:0.75rem; }
    .input-section { padding:0.75rem 1.5rem; border-top:1px solid var(--border); background:var(--surface); }
    .input-section textarea { width:100%; resize:vertical; min-height:60px; max-height:160px; border:1px solid var(--border); border-radius:0.5rem; padding:0.5rem; font-size:0.9rem; font-family:inherit; }
    .input-section textarea:focus { outline:none; border-color:var(--accent); }
    .input-row { display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem; }
    .input-actions { display:flex; gap:0.5rem; justify-content:space-between; align-items:center; margin-top:0.5rem; }
    #char-count { font-size:0.75rem; color:var(--muted); }
    #char-count.over { color:#ef4444; font-weight:bold; }

    /* ── 吹き出し ── */
    .bubble { max-width:80%; padding:0.6rem 1rem; border-radius:1rem; font-size:0.9rem; line-height:1.6; word-break:break-word; }
    .bubble-user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:0.25rem; }
    .bubble-assistant { align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:0.25rem; display:flex; gap:0.5rem; align-items:flex-start; }
    .bubble-system { align-self:center; font-size:0.8rem; color:var(--muted); background:transparent; padding:0.3rem 0; }
    .avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; }
    .bubble-content { flex:1; }

    /* ── サイドバー ── */
    .sidebar { border-left:1px solid var(--border); overflow-y:auto; padding:1rem; background:var(--surface); display:flex; flex-direction:column; gap:1rem; }
    .sidebar h3 { font-size:0.85rem; margin:0 0 0.5rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
    .sidebar label { display:block; font-size:0.8rem; color:var(--muted); margin-bottom:0.25rem; }
    .sidebar input[type="text"], .sidebar input[type="password"], .sidebar input[type="date"],
    .sidebar input[type="time"], .sidebar select {
      width:100%; padding:0.35rem 0.5rem; border:1px solid var(--border); border-radius:0.375rem; font-size:0.85rem; background:var(--bg);
    }
    .sidebar .note { font-size:0.7rem; color:var(--muted); margin-top:0.25rem; }

    /* ── ボタン ── */
    .btn { padding:0.4rem 0.8rem; background:var(--accent); color:#fff; border:none; border-radius:0.375rem; cursor:pointer; font-size:0.85rem; }
    .btn:hover { background:var(--accent-light); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
    .btn-ghost:hover { background:var(--bg); }
    .btn-icon { background:none; border:none; cursor:pointer; color:var(--muted); padding:0.25rem; }
    .btn-icon:hover { color:var(--text); }

    /* ── チュートリアル ── */
    .tutorial-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; }
    .tutorial-card { background:var(--surface); border-radius:1rem; padding:2rem; max-width:400px; width:90%; text-align:center; }
    .tutorial-card h3 { margin:0 0 0.75rem; }
    .tutorial-card p { color:var(--muted); margin:0 0 1.5rem; line-height:1.6; }
    .tutorial-nav { display:flex; gap:0.5rem; justify-content:center; align-items:center; }
    .tutorial-nav span { font-size:0.8rem; color:var(--muted); margin-right:auto; }

    /* ── ステータス ── */
    #status { font-size:0.75rem; color:var(--muted); padding:0.25rem 0; }

    /* ── API Key ── */
    .key-row { display:flex; gap:0.25rem; }
    .key-row input { flex:1; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Penguin Dyle</h1>
        <span class="subtitle">ペンギン大流の日記</span>
      </div>
      <nav>
        <a href="index.html"><i class="fa-solid fa-comments"></i> 会話</a>
        <a href="diary.html"><i class="fa-solid fa-book"></i> 日記</a>
        <a href="archive.html"><i class="fa-solid fa-chart-line"></i> 記録</a>
        <button class="btn-icon" id="theme-toggle" title="テーマ切替">
          <i class="fa-solid fa-moon" style="color:#fff"></i>
        </button>
      </nav>
    </header>

    <div class="main">
      <div class="chat-col">
        <div id="chat-area"></div>
        <div class="input-section">
          <div class="input-row">
            <input type="date" id="date-input">
            <input type="time" id="time-input">
          </div>
          <textarea id="input-area" rows="3" maxlength="4000"
                    placeholder="今日あったこと、感じたことを書いてみて…"></textarea>
          <div class="input-actions">
            <span id="char-count">0 / 4000</span>
            <div style="display:flex;gap:0.5rem">
              <button class="btn" id="send-btn">
                <i class="fa-solid fa-paper-plane"></i> 送信
              </button>
              <button class="btn btn-ghost" id="diary-btn">
                <i class="fa-solid fa-pen-nib"></i> 日記を書いてもらう
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <!-- ユーザー名 -->
        <div>
          <h3><i class="fa-solid fa-user"></i> あなたの名前</h3>
          <input type="text" id="user-name" placeholder="名前（任意）">
        </div>

        <!-- 推論モード -->
        <div>
          <h3><i class="fa-solid fa-microchip"></i> 推論モード</h3>
          <select id="provider-select">
            <option value="local">ローカル (Gemma WebGPU)</option>
            <option value="gemini">Gemini API</option>
            <option value="openai">OpenAI API</option>
            <option value="claude">Claude API</option>
          </select>

          <div id="api-key-group" style="display:none;margin-top:0.5rem">
            <label>API キー</label>
            <div class="key-row">
              <input type="password" id="api-key" placeholder="sk-...">
              <button class="btn-icon" id="api-key-toggle" title="表示/非表示">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <p class="note">キーはブラウザ内にのみ保存されます</p>
          </div>

          <div id="model-group" style="display:none;margin-top:0.5rem">
            <label>モデル</label>
            <select id="model-select"></select>
          </div>

          <div id="base-url-group" style="display:none;margin-top:0.5rem">
            <label>ベース URL</label>
            <input type="text" id="base-url" placeholder="https://api.openai.com/v1">
          </div>
        </div>

        <!-- ステータス -->
        <div id="status"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
