<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superposition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Superposition</h1>
        <p class="subtitle">カイの日記</p>
    </header>

    <main>
        <div id="chat" class="chat">
            <div class="bubble system">
                今日はどんな日だった？<br>
                日付を選んで、あったことを書いてみて。
            </div>
        </div>

        <div class="input-area">
            <div class="input-row">
                <input type="date" id="entry-date" value="{{ today }}">
                <span class="count"><span id="char-count">0</span>/4000</span>
            </div>
            <textarea id="entry-text" rows="4" maxlength="4000"
                      placeholder="今日あったこと"></textarea>
            <div class="input-actions">
                <button type="button" id="submit-btn">送る</button>
            </div>
        </div>

        <div class="sidebar">
            <div id="emotion-panel" class="panel" hidden>
                <h3>カイの感情</h3>
                <div id="emotion-bars"></div>
            </div>

            <div class="panel">
                <h3>記録</h3>
                <div class="toolbar">
                    <button type="button" id="export-btn" class="small">エクスポート</button>
                    <button type="button" id="import-btn" class="small">インポート</button>
                    <button type="button" id="clear-btn" class="small danger">全削除</button>
                    <input type="file" id="import-file" accept="application/json" hidden>
                </div>
                <ul id="history-list" class="history-list">
                    <li class="empty">まだ記録がありません。</li>
                </ul>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
