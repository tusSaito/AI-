<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penguin Dyle — 日記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc; --surface: #ffffff; --text: #1e293b;
      --muted: #64748b; --accent: #0f3460; --accent-light: #1a5276;
      --border: #e2e8f0;
    }
    body { margin:0; font-family:'Hiragino Sans','Noto Sans JP',sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); }

    .app { display:grid; grid-template-rows:auto 1fr; height:100vh; }
    header { background:var(--accent); color:#fff; padding:0.75rem 1.5rem; display:flex; align-items:center; gap:1rem; }
    header h1 { font-size:1.25rem; margin:0; }
    header .subtitle { font-size:0.8rem; opacity:0.8; }
    nav { margin-left:auto; display:flex; gap:0.75rem; align-items:center; }
    nav a { color:#fff; text-decoration:none; font-size:0.85rem; opacity:0.9; }
    nav a:hover { opacity:1; }
    .btn-icon { background:none; border:none; cursor:pointer; color:var(--muted); padding:0.25rem; }

    .content { overflow-y:auto; padding:1.5rem; max-width:800px; margin:0 auto; width:100%; }

    /* ── 日記カード ── */
    .diary-new-card { background:#fffbeb; border:2px solid #f59e0b; border-radius:1rem; padding:1.5rem; margin-bottom:1.5rem; }
    .diary-card { background:var(--surface); border:1px solid var(--border); border-radius:1rem; padding:1.25rem; margin-bottom:1rem; }
    .diary-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:0.75rem; }
    .diary-header strong { font-size:0.95rem; }
    .diary-date { font-size:0.8rem; color:var(--muted); margin-left:0.5rem; }
    .avatar { width:36px; height:36px; border-radius:50%; }
    .diary-body { line-height:1.8; font-size:0.9rem; white-space:pre-wrap; margin-bottom:1rem; }
    .diary-actions { display:flex; gap:0.5rem; }
    .btn { padding:0.4rem 0.8rem; background:var(--accent); color:#fff; border:none; border-radius:0.375rem; cursor:pointer; font-size:0.85rem; }
    .btn:hover { background:var(--accent-light); }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
    .btn-ghost:hover { background:var(--bg); }

    /* ── 感情バー ── */
    .emotion-row { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem; font-size:0.8rem; }
    .emotion-label { width:64px; text-align:right; color:var(--muted); flex-shrink:0; }
    .emotion-bar-wrap { flex:1; background:var(--border); border-radius:4px; height:8px; overflow:hidden; }
    .emotion-bar { height:100%; border-radius:4px; transition:width 0.3s; }
    .emotion-delta { width:100px; font-size:0.75rem; color:var(--muted); }
    .param-delete { font-size:0.7rem; }

    /* ── 会話履歴 ── */
    .diary-conversation { margin-top:0.75rem; }
    .diary-conversation summary { cursor:pointer; font-size:0.8rem; color:var(--muted); }
    .conversation-log { padding:0.5rem 0; }
    .conv-line { font-size:0.8rem; line-height:1.5; padding:0.15rem 0; }
    .conv-user { color:var(--accent); }
    .conv-assistant { color:var(--muted); }

    .delete-entry { margin-left:auto; }

    /* ── 空状態 ── */
    .empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); }
    .empty-state i { font-size:3rem; margin-bottom:1rem; display:block; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Penguin Dyle</h1>
        <span class="subtitle">ペンギン大流の日記</span>
      </div>
      <nav>
        <a href="index.html"><i class="fa-solid fa-comments"></i> 会話</a>
        <a href="diary.html"><i class="fa-solid fa-book"></i> 日記</a>
        <a href="archive.html"><i class="fa-solid fa-chart-line"></i> 記録</a>
        <button class="btn-icon" id="theme-toggle" title="テーマ切替">
          <i class="fa-solid fa-moon" style="color:#fff"></i>
        </button>
      </nav>
    </header>

    <div class="content">
      <!-- 新規生成された日記 -->
      <div id="new-diary"></div>

      <!-- 蓄積日記一覧 -->
      <div id="diary-list"></div>
    </div>
  </div>

  <script type="module" src="js/diary-page.js"></script>
</body>
</html>
